<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Lápiz 3D</title>
  <!-- Visor decorativo del lápiz para la versión web del LMS (Three.js + GLTFLoader), equivalente al Pencil3DView nativo
       de las apps MAUI. Sin CDN: copiar del paquete npm «three» build/three.module.js y build/three.core.js a ./three,
       y examples/jsm/loaders/GLTFLoader.js, examples/jsm/utils/BufferGeometryUtils.js y SkeletonUtils.js a ./three/addons;
       el modelo va en ./models/lapiz.glb. html, body y canvas son transparentes: sólo se ve el lápiz sobre lo que haya detrás.
       Servir por http (los módulos ES no cargan desde file://). -->
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    body { touch-action: none; user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
    /* Entrada: opacidad 0 → 1 y escala 0,94 → 1 en 0,8 s con easeOutCubic; la clase la pone el visor al cargar el modelo. */
    #view {
      display: block; width: 100%; height: 100%;
      opacity: 0; transform: scale(0.94); transform-origin: 50% 50%;
      transition: opacity 0.8s cubic-bezier(0.33, 1, 0.68, 1), transform 0.8s cubic-bezier(0.33, 1, 0.68, 1);
    }
    #view.visible { opacity: 1; transform: scale(1); }
  </style>
  <script type="importmap">
    { "imports": { "three": "./three/three.module.js", "three/addons/": "./three/addons/" } }
  </script>
</head>
<body>
  <canvas id="view" aria-hidden="true"></canvas>
  <script type="module" src="./pencil-viewer.js"></script>
</body>
</html>
